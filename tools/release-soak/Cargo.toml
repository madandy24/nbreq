[package]
name = "nbreq-release-soak"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[features]
default = ["resolver"]
resolver = ["nbreq/resolver"]

[dependencies]
nbreq = { path = "../..", default-features = false, features = ["native"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "=0.13.2"
time = { version = "=0.3.45", default-features = false, features = ["std"] }
serde_json = "=1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
