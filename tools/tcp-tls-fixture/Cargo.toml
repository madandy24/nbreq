[package]
name = "nbreq-tcp-tls-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
rcgen = "=0.13.2"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.151"
time = { version = "=0.3.45", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "tcp-tls-fixture"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
