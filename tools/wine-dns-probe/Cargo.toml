[package]
name = "nbreq-wine-dns-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[features]
default = ["resolver"]
resolver = ["nbreq/resolver"]

[dependencies]
nbreq = { path = "../..", default-features = false, features = ["native"] }
nbreq-winpoll = { path = "../../support/winpoll" }
ipconfig = { version = "=0.3.4", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
