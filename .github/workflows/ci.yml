name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu stable
            os: ubuntu-latest
            toolchain: stable
          - name: Windows stable
            os: windows-latest
            toolchain: stable
          - name: Windows MSRV 1.85
            os: windows-latest
            toolchain: 1.85.0
          - name: Ubuntu MSRV 1.85
            os: ubuntu-latest
            toolchain: 1.85.0
          - name: macOS 15 Intel stable
            os: macos-15-intel
            toolchain: stable
          - name: macOS 15 Intel MSRV 1.85
            os: macos-15-intel
            toolchain: 1.85.0
          - name: macOS 15 Apple Silicon stable
            os: macos-15
            toolchain: stable
          - name: macOS 15 Apple Silicon MSRV 1.85
            os: macos-15
            toolchain: 1.85.0

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.toolchain }}

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Record macOS architecture
        if: runner.os == 'macOS'
        run: |
          uname -m
          sw_vers

      - name: Fetch exact locked graph
        run: cargo fetch --locked

      - name: Run complete offline verifier
        run: cargo run --locked --offline --manifest-path tools/xtask/Cargo.toml -- verify --offline

      - name: Verify fresh consumer dependency graphs
        run: python tools/release-consumer/pre_r5.py --out "${{ runner.temp }}/nbreq-consumers" --toolchains ${{ matrix.toolchain }}

      - name: Preserve consumer locks and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumers-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/nbreq-consumers/*.json
            ${{ runner.temp }}/nbreq-consumers/*.log
            ${{ runner.temp }}/nbreq-consumers/*/Cargo.lock
            ${{ runner.temp }}/nbreq-consumers/*/Cargo.toml
            ${{ runner.temp }}/nbreq-consumers/*/versions.json
          if-no-files-found: warn

  rustsec:
    name: RustSec advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select stable Rust
        run: rustup default stable

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Scan exact lock graph
        shell: bash
        run: cargo audit --db "$RUNNER_TEMP/nbreq-advisory-db" --file Cargo.lock --json | tee cargo-audit.json

      - name: Record advisory database identity
        if: always()
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/nbreq-advisory-db" log -1 --format='%H %cI' | tee advisory-db.txt
          cargo audit --version | tee -a advisory-db.txt
          sha256sum Cargo.lock | tee -a advisory-db.txt

      - name: Preserve advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-evidence
          path: |
            cargo-audit.json
            advisory-db.txt
          if-no-files-found: error

  licenses:
    name: Component and dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select stable Rust
        run: rustup default stable

      - name: Fetch exact locked graph
        run: cargo fetch --locked

      - name: Install cargo-about
        run: cargo install --locked --features cli --version 0.9.1 cargo-about

      - name: Regenerate locked license report
        run: cargo about generate --frozen --all-features --fail --output-file THIRD_PARTY_LICENSES.generated.html about.hbs

      - name: Reject license-report drift
        run: cmp THIRD_PARTY_LICENSES.html THIRD_PARTY_LICENSES.generated.html
