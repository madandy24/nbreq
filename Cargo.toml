[package]
name = "nbreq"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Runtime-independent cancellable HTTP client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madandy24/nbreq"
homepage = "https://github.com/madandy24/nbreq"
documentation = "https://docs.rs/nbreq"
readme = "README.md"
keywords = ["http", "networking", "nonblocking", "cancellation", "client"]
categories = ["web-programming::http-client", "network-programming"]
publish = false
autoexamples = false
include = [
    "/src/**",
    "!/src/backend/curl.rs",
    "!/src/curl_tests.rs",
    "/tests/**",
    "/examples/ffi_owner.rs",
    "/examples/manual.rs",
    "/examples/native_platform_https.rs",
    "/examples/spawned.rs",
    "/docs/getting-started.md",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[workspace]
members = ["support/winpoll"]
resolver = "2"

[features]
default = ["native"]
native = [
    "dep:hickory-proto",
    "dep:getrandom",
    "dep:httparse",
    "dep:ipconfig",
    "dep:mio",
    "dep:nbreq-winpoll",
    "dep:resolv-conf",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:url",
]
test-support = []

[dependencies]
getrandom = { version = "=0.3.4", optional = true }
# Wire types only: DNSSEC is disabled and production encoding emits one bounded question with no
# records. See SECURITY.md for the reviewed RustSec exceptions on this Rust-1.85-compatible pin.
hickory-proto = { version = "=0.25.2", optional = true, default-features = false, features = ["std"] }
httparse = { version = "=1.10.1", optional = true }
mio = { version = "=1.0.4", optional = true, features = ["net", "os-poll"] }
rustls = { version = "=0.23.42", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.0", optional = true, default-features = false }
url = { version = "=2.5.8", optional = true }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "=0.3.4", optional = true, default-features = false }
nbreq-winpoll = { path = "support/winpoll", version = "0.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
resolv-conf = { version = "=0.7.6", optional = true, default-features = false }

[dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "=0.6.5"
stats_alloc = "=0.1.10"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[[example]]
name = "native_platform_https"
required-features = ["native", "test-support"]
