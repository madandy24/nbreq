[package]
name = "nbreq"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Runtime-independent cancellable HTTP client"
publish = false

[workspace]
members = ["support/winpoll"]
resolver = "2"

[features]
default = []
curl-pilot = ["dep:curl"]
curl-pilot-vendored = ["curl-pilot", "curl/ssl"]
native = [
    "dep:hickory-proto",
    "dep:getrandom",
    "dep:httparse",
    "dep:ipconfig",
    "dep:mio",
    "dep:nbreq-winpoll",
    "dep:resolv-conf",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:url",
]
test-support = []
ffi = []

[dependencies]
curl = { version = "=0.4.50", optional = true, default-features = false, features = ["poll_7_68_0", "nbreq-explicit-init"] }
getrandom = { version = "=0.3.4", optional = true }
hickory-proto = { version = "=0.25.2", optional = true, default-features = false, features = ["std"] }
httparse = { version = "=1.10.1", optional = true }
mio = { version = "=1.0.4", optional = true, features = ["net", "os-poll"] }
rustls = { version = "=0.23.42", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.0", optional = true, default-features = false }
url = { version = "=2.5.8", optional = true }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "=0.3.4", optional = true, default-features = false }
nbreq-winpoll = { path = "support/winpoll", optional = true }

[target.'cfg(unix)'.dependencies]
resolv-conf = { version = "=0.7.6", optional = true, default-features = false }

[dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "=0.6.5"
stats_alloc = "=0.1.10"

[patch.crates-io]
curl = { path = "vendor/curl" }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[[example]]
name = "native_platform_https"
required-features = ["native", "test-support"]

[[example]]
name = "wp9_compare"
required-features = ["native", "curl-pilot", "test-support"]

[[example]]
name = "wp9_cancel_compare"
required-features = ["native", "curl-pilot", "test-support"]
